<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="2" dy="2" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg-gradient)" />
  <g transform="translate(640,360)" text-anchor="middle" filter="url(#shadow)">
    <text y="-50" font-family="Arial, sans-serif" font-size="64" fill="white" font-weight="bold">Tibiao Municipal</text>
    <text y="50" font-family="Arial, sans-serif" font-size="64" fill="white" font-weight="bold">Theme Song</text>
  </g>
  <g transform="translate(640,360)" filter="url(#shadow)">
    <circle r="50" fill="#ef4444" />
    <path d="M-20 -30l60 30l-60 30z" fill="white" />
  </g>
</svg>